{% extends 'layout.html'%}
{% block title%}Add a new post{%endblock%}
{%block h1 %}Uploading media{%endblock%}
{%block main%}
    <form method="post" enctype="multipart/form-data">
        <input type="text" name="title" id="title" placeholder="Post title..." required>
        <textarea name="content" id="content"placeholder="Post caption"required></textarea>
        <input type="file" name="image" id="image" accept=".jpg,.png">
        <input type="submit" value="Save Post">
    </form>
{%endblock%}
